    <style>
        * { box-sizing: border-box; }
        
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .fill-icon { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { 
            background: linear-gradient(to bottom, #cafd00, #516700);
            border-radius: 10px;
            opacity: 0.5;
        }
        ::-webkit-scrollbar-thumb:hover { opacity: 0.8; }

        /* Animations */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(202,253,0,0.4); }
            70% { box-shadow: 0 0 0 15px rgba(202,253,0,0); }
            100% { box-shadow: 0 0 0 0 rgba(202,253,0,0); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        @keyframes messageSlide {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes shimmer {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        /* Utility classes */
        .animate-fadeUp { animation: fadeUp 0.6s ease forwards; }
        .animate-slideInLeft { animation: slideInLeft 0.5s ease forwards; }
        .animate-slideInRight { animation: slideInRight 0.5s ease forwards; }
        .animate-pulse-ring { animation: pulse-ring 2s infinite; }
        .animate-float { animation: float 3s ease-in-out infinite; }
        .animate-message { animation: messageSlide 0.3s ease; }

        /* Navigation */
        nav { 
            animation: slideInLeft 0.6s ease;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        /* Sidebar improvements */
        #sidebar {
            background: linear-gradient(to bottom, #0e0e0e, #131313);
            box-shadow: inset -1px 0 0 rgba(255, 255, 255, 0.05);
        }

        /* Tabs styling */
        .flex.border-b.border-white\/5 button {
            position: relative;
            overflow: hidden;
        }

        .flex.border-b.border-white\/5 button::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, #cafd00, #516700);
            transform: scaleX(0);
            transform-origin: center;
            transition: transform 0.3s ease;
        }

        .flex.border-b.border-white\/5 button.text-primary-fixed::after {
            transform: scaleX(1);
        }

        /* Friend item improvements */
        .friend-item {
            margin: 4px 8px;
            padding: 12px 16px;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
        }

        .friend-item::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(202, 253, 0, 0.1), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .friend-item:hover::before {
            opacity: 1;
        }

        .friend-item:hover {
            background: linear-gradient(135deg, rgba(202, 253, 0, 0.08), rgba(202, 253, 0, 0.02));
            box-shadow: 0 4px 20px rgba(202, 253, 0, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .friend-item.active {
            background: linear-gradient(135deg, rgba(202, 253, 0, 0.15), rgba(202, 253, 0, 0.05));
            box-shadow: 0 0 25px rgba(202, 253, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .friend-item:active {
            transform: scale(0.98);
        }

        /* Search input improvements */
        #searchInput {
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #1a1a1a, #131313);
        }

        #searchInput:focus {
            background: linear-gradient(135deg, #262626, #1a1a1a);
            border-color: #cafd00;
            box-shadow: 0 0 20px rgba(202, 253, 0, 0.2);
        }

        /* Search result item improvements */
        .flex.items-center.gap-3.p-3.bg-surface-container {
            border-radius: 14px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;

            padding: 16px;

            box-shadow: 0 4px 15px rgba(202, 253, 0, 0.2);

            box-shadow: 0 8px 25px rgba(202, 253, 0, 0.3);
        }

        .bg-primary-fixed.hover\:bg-primary:active {

        }

        /* Message styling */
        .px-4.py-2.rounded-2xl {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            word-wrap: break-word;
        }

        .px-4.py-2.rounded-2xl.bg-primary-fixed {
            background: linear-gradient(135deg, #cafd00, #beee00);
            box-shadow: 0 4px 15px rgba(202, 253, 0, 0.25);

            background: linear-gradient(135deg, #262626, #1a1a1a);
            border: 1px solid rgba(202, 253, 0, 0.1);

        /* Button styling improvements */
        button {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        button:hover:not(:disabled) {
            transform: translateY(-1px);
        }

            transform: translateY(0);
        }

        /* Loading spinner improvements */
        .animate-spin {
            animation: spin 0.8s linear infinite;
            color: #cafd00;
        }

        /* Smooth transitions */
        .transition-smooth { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

        /* Toast notification */
        .toast {
            animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }

        }

        /* Empty state improvements */
        .flex.flex-col.items-center.justify-center.py-16,
        .flex.flex-col.items-center.justify-center.py-12 {
            padding: 40px 20px;
        }

        .flex.flex-col.items-center.justify-center.py-16 .material-symbols-outlined,

                margin: 6px 4px;
                padding: 14px 12px;
            }

            #msgInput,
            #searchInput {
                font-size: 16px;
            }
        }
    </style>
</head>

<!-- ================= TRENING AURA CHAT SYSTEM ================= -->
<script>
let currentUser = null;
let activeFriendId = null;
let activeChatId = null;
let chatRef = null;
let searchTimeout = null;

// ───────────────── INIT ─────────────────
document.addEventListener('DOMContentLoaded', async function () {
    currentUser = AuraAuth.getCurrentUser();

    if (!currentUser) {
        window.location.href = './login.html';
        return;
    }

    document.getElementById('navUserName').textContent = currentUser.name;

    // Initialize first panel
    document.getElementById('panel-friends').classList.remove('hidden');
    document.getElementById('tab-friends').classList.add('border-b-2');
    document.getElementById('tab-friends').classList.add('border-primary-fixed');
    document.getElementById('tab-friends').classList.add('text-primary-fixed');

    await renderFriends();
    await renderRequests();
});

function doLogout() {
    AuraAuth.logout();
    window.location.href = './index.html';
}

// ───────────────── TABS ─────────────────
function switchTab(tab) {
    ['friends', 'search', 'requests'].forEach(t => {
        const panel = document.getElementById('panel-' + t);
        const tabBtn = document.getElementById('tab-' + t);
        
        if (t === tab) {
            panel.classList.remove('hidden');
            tabBtn.classList.add('border-b-2', 'border-primary-fixed', 'text-primary-fixed');
        } else {
            panel.classList.add('hidden');
            tabBtn.classList.remove('border-b-2', 'border-primary-fixed', 'text-primary-fixed');
        }
    });

    if (tab === 'search') {
        setTimeout(() => document.getElementById('searchInput').focus(), 50);
    }
}

// ───────────────── FRIENDS ─────────────────
async function renderFriends() {
    const list = document.getElementById('friendsList');
    const friends = await AuraAuth.getFriends();

    if (!friends.length) {
        list.innerHTML = `
        <div class="flex flex-col items-center justify-center py-16 text-center text-on-surface-variant">
            <span class="material-symbols-outlined text-6xl opacity-15 mb-3">group</span>
            <p class="text-sm font-medium">No friends yet</p>
            <p class="text-xs opacity-70 mt-1">Find people to chat with!</p>
        </div>`;
        return;
    }

    list.innerHTML = friends.map((f, i) => `
        <div class="friend-item px-4 py-3 cursor-pointer border-l-3 border-transparent hover:bg-surface-container-low transition-smooth ${activeFriendId === f.uid ? 'active bg-surface-container-low border-l-primary-fixed' : ''}"
             style="animation: fadeUp 0.4s ease both; animation-delay: ${i * 30}ms;"
             onclick="openChat('${f.uid}', '${escapeHtml(f.name)}', '${escapeHtml(f.email)}')">
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-full bg-gradient-to-br from-primary-fixed to-primary-dim flex items-center justify-center font-headline font-black text-on-primary-fixed flex-shrink-0 shadow-md">${f.name.charAt(0).toUpperCase()}</div>
                <div class="flex-1 min-w-0">
                    <div class="font-bold text-sm truncate">${escapeHtml(f.name)}</div>
                    <div class="text-xs text-on-surface-variant truncate" id="last-${f.uid}">No messages</div>
                </div>
                <span class="material-symbols-outlined text-lg text-primary-fixed opacity-0 group-hover:opacity-100 transition-opacity">arrow_forward</span>
            </div>
        </div>
    `).join('');

    friends.forEach(loadLastMessage);
}

function loadLastMessage(friendUid) {
    const chatId = AuraChat.getChatId(currentUser.uid, friendUid);

    AuraAuth.db.ref(`chats/${chatId}/messages`)
        .orderByChild('time')
        .limitToLast(1)
        .once('value', snap => {

            const el = document.getElementById('last-' + friendUid);
            if (!el) return;

            if (!snap.exists()) {
                el.textContent = 'No messages';
                return;
            }

            let last = null;
            snap.forEach(m => last = m.val());

            if (!last) return;

            el.textContent =
                (last.senderId === currentUser.uid ? 'You: ' : '') +
                last.text;
        });
}

// ───────────────── SEARCH ─────────────────
function onSearchInput(val) {
    clearTimeout(searchTimeout);

    if (!val.trim()) {
        document.getElementById('searchResults').innerHTML =
            `<div class="text-center py-12 text-on-surface-variant"><span class="material-symbols-outlined text-4xl block mb-2 opacity-20">person_search</span><p class="text-sm">Type to search for users</p></div>`;
        return;
    }

    searchTimeout = setTimeout(() => doSearch(val), 300);
}

async function doSearch(query) {
    const results = document.getElementById('searchResults');

    const users = await AuraAuth.searchUsers(query);
    const friends = await AuraAuth.getFriends();
    const sent = await AuraAuth.getSentRequests();

    const friendIds = friends.map(f => f.uid);

    if (!users.length) {
        results.innerHTML = `<div class="text-center py-12 text-on-surface-variant"><span class="material-symbols-outlined text-5xl opacity-15 block mb-2">person_search</span><p class="text-sm font-medium">No users found</p></div>`;
        return;
    }

    results.innerHTML = users.map((u, i) => {

        const isFriend = friendIds.includes(u.uid);
        const isSent = sent.includes(u.uid);

        let btn = '';

        if (isFriend) {
            btn = `<span class="px-3 py-1.5 bg-primary-fixed/15 text-primary-fixed text-xs font-black rounded-full whitespace-nowrap flex items-center gap-1"><span class="material-symbols-outlined text-sm">check</span>Friends</span>`;
        } else if (isSent) {
            btn = `<span class="px-3 py-1.5 bg-surface-container text-on-surface-variant text-xs font-black rounded-full whitespace-nowrap flex items-center gap-1"><span class="material-symbols-outlined text-sm">schedule</span>Sent</span>`;
        } else {
            btn = `<button class="px-4 py-2 bg-primary-fixed text-on-primary-fixed text-xs font-black rounded-full whitespace-nowrap hover:shadow-lg hover:shadow-primary-fixed/30 transition-smooth flex items-center gap-1" onclick="sendFriendRequest('${u.uid}')"><span class="material-symbols-outlined text-sm">person_add</span>Add</button>`;
        }

        return `
        <div class="flex items-center gap-3 p-4 bg-surface-container rounded-xl mb-2 hover:bg-surface-container-high transition-smooth" style="animation: fadeUp 0.4s ease both; animation-delay: ${i * 30}ms;">
            <div class="w-11 h-11 rounded-full bg-gradient-to-br from-primary-fixed to-primary-dim flex items-center justify-center font-headline font-black text-on-primary-fixed flex-shrink-0 shadow-md">${u.name.charAt(0).toUpperCase()}</div>
            <div style="flex:1; min-width: 0;">
                <div class="font-bold text-sm">${escapeHtml(u.name)}</div>
                <div class="text-xs text-on-surface-variant truncate">${escapeHtml(u.email)}</div>
            </div>
            ${btn}
        </div>`;
    }).join('');
}

async function sendFriendRequest(uid) {
    const r = await AuraAuth.sendFriendRequest(uid);

    if (r.success) {
        showToast('Request sent!', false);
        doSearch(document.getElementById('searchInput').value);
    } else {
        showToast(r.error, true);
    }
}

// ───────────────── REQUESTS ─────────────────
async function renderRequests() {
    const list = document.getElementById('requestsList');
    const reqs = await AuraAuth.getFriendRequests();

    const badge = document.getElementById('reqBadge');

    if (reqs.length) {
        badge.classList.remove('hidden');
        badge.textContent = reqs.length;
    } else {
        badge.classList.add('hidden');
    }

    if (!reqs.length) {
        list.innerHTML = `<div class="flex flex-col items-center justify-center py-16 text-center text-on-surface-variant"><span class="material-symbols-outlined text-6xl opacity-15 mb-3">mail</span><p class="text-sm font-medium">No requests</p><p class="text-xs opacity-70 mt-1">People will send you requests here</p></div>`;
        return;
    }

    list.innerHTML = reqs.map((r, i) => `
        <div class="flex items-center gap-3 px-4 py-4 border-b border-white/5 hover:bg-surface-container-low transition-smooth" style="animation: fadeUp 0.4s ease both; animation-delay: ${i * 30}ms;">
            <div class="w-11 h-11 rounded-full bg-gradient-to-br from-primary-fixed to-primary-dim flex items-center justify-center font-headline font-black text-on-primary-fixed flex-shrink-0 shadow-md">${r.name.charAt(0).toUpperCase()}</div>
            <div style="flex:1; min-width: 0;">
                <div class="font-bold text-sm">${escapeHtml(r.name)}</div>
                <div class="text-xs text-on-surface-variant truncate">${escapeHtml(r.email)}</div>
            </div>
            <div class="flex gap-2 ml-auto">
                <button onclick="acceptRequest('${r.uid}')" class="w-9 h-9 rounded-lg bg-primary-fixed text-on-primary-fixed flex items-center justify-center hover:shadow-lg hover:shadow-primary-fixed/30 transition-smooth font-bold text-lg" title="Accept">
                    <span class="material-symbols-outlined text-lg">check</span>
                </button>
                <button onclick="declineRequest('${r.uid}')" class="w-9 h-9 rounded-lg bg-error-container text-error flex items-center justify-center hover:shadow-lg transition-smooth font-bold text-lg" title="Decline">
                    <span class="material-symbols-outlined text-lg">close</span>
                </button>
            </div>
        </div>
    `).join('');
}

async function acceptRequest(uid) {
    await AuraAuth.acceptFriendRequest(uid);
    await renderRequests();
    await renderFriends();
    showToast('Friend added!', false);
}

async function declineRequest(uid) {
    await AuraAuth.declineFriendRequest(uid);
    await renderRequests();
}

// ───────────────── CHAT ─────────────────
function openChat(uid, name, email) {
    // uid должен быть строкой
    if (typeof uid !== 'string') {
        console.error('openChat: uid is not a string', uid);
        return;
    }

    if (chatRef) chatRef.off();

    activeFriendId = uid;
    activeChatId = AuraChat.getChatId(currentUser.uid, uid);

    document.getElementById('chatName').textContent = name;
    document.getElementById('chatStatus').textContent = email;
    document.getElementById('chatAvatar').textContent = name.charAt(0).toUpperCase();

    // Показать чат панель
    const chatPanel = document.getElementById('chatPanel');
    const noChatSelected = document.getElementById('noChatSelected');
    chatPanel.classList.remove('hidden');
    chatPanel.classList.add('flex');
    if (noChatSelected) noChatSelected.classList.add('hidden');

    const container = document.getElementById('chatMessages');
    if (!container) {
        console.error('chatMessages element not found');
        return;
    }
    container.innerHTML = `<div class="flex items-center justify-center py-8 text-on-surface-variant gap-2" id="loadingMsg"><span class="material-symbols-outlined text-lg animate-spin">refresh</span> Loading...</div>`;

    chatRef = AuraAuth.db.ref(`chats/${activeChatId}/messages`);
    chatRef.off();

    chatRef.on('child_added', snap => {
        addMessageToUI(snap.val());
    });

    renderFriends();
}

function addMessageToUI(m) {
    const box = document.getElementById('chatMessages');
    if (!box) return; // защита от null

    // Убрать сообщение "Loading..."
    const loadingMsg = document.getElementById('loadingMsg');
    if (loadingMsg) loadingMsg.remove();

    const isMe = m.senderId === currentUser.uid;
    const div = document.createElement('div');
    div.className = `flex ${isMe ? 'justify-end' : 'justify-start'} animate-message`;

    const time = new Date(m.time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    div.innerHTML = `
        <div class="max-w-xs lg:max-w-md">
            <div class="px-5 py-3 rounded-2xl ${isMe
                ? 'bg-gradient-to-br from-primary-fixed to-primary-dim text-on-primary-fixed rounded-br-none shadow-lg shadow-primary-fixed/20'
                : 'bg-surface-container text-on-surface rounded-bl-none border border-white/10 shadow-md'}">
                <p class="text-sm font-medium break-words leading-relaxed">${escapeHtml(m.text)}</p>
            </div>
            <p class="text-xs text-on-surface-variant mt-2 ${isMe ? 'text-right' : 'text-left'}">${time}</p>
        </div>
    `;

    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
}

async function sendMessage() {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();

    if (!text || !activeFriendId) return;

    input.value = '';

    await AuraChat.sendMessage(activeFriendId, text);
}

function removeFriendConfirm() {
    if (!activeFriendId) return;
    
    const friendName = document.getElementById('chatName').textContent;
    
    if (confirm(`Remove ${friendName} from friends?`)) {
        // Call remove friend function if available
        showToast('Friend removed', false);
        closeChatPanel();
        renderFriends();
    }
}

// ───────────────── HELPERS ─────────────────
function escapeHtml(t) {
    return (t || '').replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;');
}

function showToast(msg, err = false) {
    const t = document.createElement('div');
    t.className = 'fixed bottom-8 left-1/2 -translate-x-1/2 z-[9999] px-6 py-4 rounded-xl font-bold text-sm shadow-2xl toast flex items-center gap-3';
    
    if (err) {
        t.style.background = 'linear-gradient(135deg, #b92902, #8a1f01)';
        t.style.color = '#fff';
        t.innerHTML = `<span class="material-symbols-outlined text-lg">error</span>${msg}`;
    } else {
        t.style.background = 'linear-gradient(135deg, #cafd00, #beee00)';
        t.style.color = '#3a4a00';
        t.innerHTML = `<span class="material-symbols-outlined text-lg fill-icon">check_circle</span>${msg}`;
    }
    
    document.body.appendChild(t);
    
    setTimeout(() => {
        t.style.opacity = '0';
        t.style.transform = 'translateY(20px)';
        setTimeout(() => t.remove(), 300);
    }, 2500);
}
</script>

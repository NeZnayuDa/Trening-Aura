    <style>
        * { box-sizing: border-box; }
        
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .fill-icon { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #262626; border-radius: 10px; }

        /* Animations */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(202,253,0,0.4); }
            70% { box-shadow: 0 0 0 15px rgba(202,253,0,0); }
            100% { box-shadow: 0 0 0 0 rgba(202,253,0,0); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        @keyframes messageSlide {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes shimmer {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        /* Utility classes */
        .animate-fadeUp { animation: fadeUp 0.6s ease forwards; }
        .animate-slideInLeft { animation: slideInLeft 0.5s ease forwards; }
        .animate-slideInRight { animation: slideInRight 0.5s ease forwards; }
        .animate-pulse-ring { animation: pulse-ring 2s infinite; }
        .animate-float { animation: float 3s ease-in-out infinite; }
        .animate-message { animation: messageSlide 0.3s ease; }

        /* Navigation */
        nav { animation: slideInLeft 0.6s ease; }

        /* Chat item hover glow */
        .friend-item:hover { box-shadow: 0 0 20px rgba(202, 253, 0, 0.08); }
        
        /* Button glow on hover */
        .btn-add:hover { box-shadow: 0 0 15px rgba(202, 253, 0, 0.3); }
        .send-btn:hover { box-shadow: 0 0 15px rgba(202, 253, 0, 0.3); }

        /* Smooth transitions */
        .transition-smooth { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

        /* Toast notification */
        .toast {
            animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            .sidebar { z-index: 40; }
            .chat-panel { z-index: 50; }
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body overflow-x-hidden">

<!-- MAIN LAYOUT -->
<div class="flex h-screen pt-16 bg-surface">

    <!-- SIDEBAR -->
    <div class="w-80 flex-shrink-0 border-r border-white/5 flex flex-col bg-surface-container-lowest transition-smooth md:relative md:z-40 absolute inset-0 pt-16 md:pt-0" id="sidebar">
        
        <!-- TABS -->
        <div class="flex border-b border-white/5">
            <button class="flex-1 py-3.5 px-2 text-xs font-black uppercase tracking-widest text-on-surface-variant hover:text-primary-fixed border-b-2 border-transparent active:border-primary-fixed transition-all" onclick="switchTab('friends')" id="tab-friends">Friends</button>
            <button class="flex-1 py-3.5 px-2 text-xs font-black uppercase tracking-widest text-on-surface-variant hover:text-primary-fixed border-b-2 border-transparent active:border-primary-fixed transition-all" onclick="switchTab('search')" id="tab-search">Find</button>
            <button class="flex-1 py-3.5 px-2 text-xs font-black uppercase tracking-widest text-on-surface-variant hover:text-primary-fixed border-b-2 border-transparent active:border-primary-fixed transition-all relative" onclick="switchTab('requests')" id="tab-requests">
                Requests
                <span class="absolute top-1 right-1 bg-primary-fixed text-on-primary-fixed text-xs font-black rounded-full h-5 w-5 flex items-center justify-center hidden" id="reqBadge">0</span>
            </button>
        </div>

        <!-- FRIENDS PANEL -->
        <div class="flex-1 overflow-y-auto hidden" id="panel-friends">
            <div class="px-4 py-3 text-xs font-black uppercase tracking-widest text-on-surface-variant">Your Friends</div>
            <div id="friendsList">
                <div class="flex items-center justify-center py-8 text-on-surface-variant gap-2">
                    <span class="material-symbols-outlined text-lg animate-spin">refresh</span> Loading...
                </div>
            </div>
        </div>

        <!-- SEARCH PANEL -->
        <div class="flex-1 overflow-y-auto hidden p-4" id="panel-search">
            <div class="relative mb-4">
                <span class="material-symbols-outlined absolute left-3 top-3 text-on-surface-variant">search</span>
                <input class="w-full bg-surface-container border border-white/8 text-white px-3 py-2.5 pl-10 rounded-xl text-sm outline-none focus:border-primary-fixed/40 focus:ring-2 focus:ring-primary-fixed/10 transition-smooth" id="searchInput" type="text" placeholder="Search by name..." oninput="onSearchInput(this.value)" />

            <div id="requestsList">

            <button class="bg-primary-fixed hover:bg-primary text-on-primary-fixed rounded-xl p-3 flex items-center justify-center flex-shrink-0 transition-smooth hover:shadow-lg hover:shadow-primary-fixed/30" onclick="sendMessage()">

<style>
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.animate-spin { animation: spin 0.8s linear infinite; }
</style>

<!-- ================= TRENING AURA CHAT SYSTEM ================= -->
<script>
let currentUser = null;
let activeFriendId = null;
let activeChatId = null;
let chatRef = null;
let searchTimeout = null;

// ───────────────── INIT ─────────────────
document.addEventListener('DOMContentLoaded', async function () {
    currentUser = AuraAuth.getCurrentUser();

    if (!currentUser) {
        window.location.href = './login.html';
        return;
    }

    document.getElementById('navUserName').textContent = currentUser.name;

    // Initialize first panel
    document.getElementById('panel-friends').classList.remove('hidden');
    document.getElementById('tab-friends').classList.add('border-b-2');
    document.getElementById('tab-friends').classList.add('border-primary-fixed');
    document.getElementById('tab-friends').classList.add('text-primary-fixed');

    await renderFriends();
    await renderRequests();
});

function doLogout() {
    AuraAuth.logout();
    window.location.href = './index.html';
}

// ───────────────── TABS ─────────────────
function switchTab(tab) {
    ['friends', 'search', 'requests'].forEach(t => {
        const panel = document.getElementById('panel-' + t);
        const tabBtn = document.getElementById('tab-' + t);
        
        if (t === tab) {
            panel.classList.remove('hidden');
            tabBtn.classList.add('border-b-2', 'border-primary-fixed', 'text-primary-fixed');
        } else {
            panel.classList.add('hidden');
            tabBtn.classList.remove('border-b-2', 'border-primary-fixed', 'text-primary-fixed');
        }
    });

    if (tab === 'search') {
        setTimeout(() => document.getElementById('searchInput').focus(), 50);
    }
}

// ───────────────── FRIENDS ─────────────────
async function renderFriends() {
    const list = document.getElementById('friendsList');
    const friends = await AuraAuth.getFriends();

    if (!friends.length) {
        list.innerHTML = `
        <div class="flex flex-col items-center justify-center py-16 text-center text-on-surface-variant">
            <span class="material-symbols-outlined text-5xl opacity-20 mb-3">group</span>
            <p class="text-sm">No friends yet</p>
        </div>`;
        return;
    }

    list.innerHTML = friends.map((f, i) => `
        <div class="friend-item px-4 py-3 cursor-pointer border-l-3 border-transparent hover:bg-surface-container-low transition-smooth ${activeFriendId === f.uid ? 'active bg-surface-container-low border-l-primary-fixed' : ''}"
             style="animation: fadeUp 0.4s ease both; animation-delay: ${i * 30}ms;"
             onclick="openChat('${f.uid}', '${escapeHtml(f.name)}', '${escapeHtml(f.email)}')">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center font-headline font-black text-primary-fixed flex-shrink-0">${f.name.charAt(0).toUpperCase()}</div>
                <div class="flex-1 min-w-0">
                    <div class="font-bold text-sm">${escapeHtml(f.name)}</div>
                    <div class="text-xs text-on-surface-variant truncate" id="last-${f.uid}">...</div>
                </div>
            </div>
        </div>
    `).join('');

    friends.forEach(loadLastMessage);
}

function loadLastMessage(friendUid) {
    const chatId = AuraChat.getChatId(currentUser.uid, friendUid);

    AuraAuth.db.ref(`chats/${chatId}/messages`)
        .orderByChild('time')
        .limitToLast(1)
        .once('value', snap => {

            const el = document.getElementById('last-' + friendUid);
            if (!el) return;

            if (!snap.exists()) {
                el.textContent = 'No messages';
                return;
            }

            let last = null;
            snap.forEach(m => last = m.val());

            if (!last) return;

            el.textContent =
                (last.senderId === currentUser.uid ? 'You: ' : '') +
                last.text;
        });
}

// ───────────────── SEARCH ─────────────────
function onSearchInput(val) {
    clearTimeout(searchTimeout);

    if (!val.trim()) {
        document.getElementById('searchResults').innerHTML =
            `<div class="text-center py-12 text-on-surface-variant"><span class="material-symbols-outlined text-4xl block mb-2 opacity-20">person_search</span><p class="text-sm">Type to search for users</p></div>`;
        return;
    }

    searchTimeout = setTimeout(() => doSearch(val), 300);
}

async function doSearch(query) {
    const results = document.getElementById('searchResults');

    const users = await AuraAuth.searchUsers(query);
    const friends = await AuraAuth.getFriends();
    const sent = await AuraAuth.getSentRequests();

    const friendIds = friends.map(f => f.uid);

    if (!users.length) {
        results.innerHTML = `<div class="text-center py-12 text-on-surface-variant"><p class="text-sm">No users found</p></div>`;
        return;
    }

    results.innerHTML = users.map((u, i) => {

        const isFriend = friendIds.includes(u.uid);
        const isSent = sent.includes(u.uid);

        let btn = '';

        if (isFriend) {
            btn = `<span class="px-3 py-1.5 bg-primary-fixed/15 text-primary-fixed text-xs font-black rounded-full whitespace-nowrap">Friends</span>`;
        } else if (isSent) {
            btn = `<span class="px-3 py-1.5 bg-surface-container text-on-surface-variant text-xs font-black rounded-full whitespace-nowrap">Sent</span>`;
        } else {
            btn = `<button class="px-3 py-1.5 bg-primary-fixed text-on-primary-fixed text-xs font-black rounded-full whitespace-nowrap hover:shadow-lg hover:shadow-primary-fixed/30 transition-smooth" onclick="sendFriendRequest('${u.uid}')">Add</button>`;
        }

        return `
        <div class="flex items-center gap-3 p-3 bg-surface-container rounded-xl mb-2 hover:bg-surface-container-high transition-smooth" style="animation: fadeUp 0.4s ease both; animation-delay: ${i * 30}ms;">
            <div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center font-headline font-black text-primary-fixed flex-shrink-0">${u.name.charAt(0).toUpperCase()}</div>
            <div style="flex:1; min-width: 0;">
                <div class="font-bold text-sm">${escapeHtml(u.name)}</div>
                <div class="text-xs text-on-surface-variant truncate">${escapeHtml(u.email)}</div>
            </div>
            ${btn}
        </div>`;
    }).join('');
}

async function sendFriendRequest(uid) {
    const r = await AuraAuth.sendFriendRequest(uid);

    if (r.success) {
        showToast('Request sent!', false);
        doSearch(document.getElementById('searchInput').value);
    } else {
        showToast(r.error, true);
    }
}

// ───────────────── REQUESTS ─────────────────
async function renderRequests() {
    const list = document.getElementById('requestsList');
    const reqs = await AuraAuth.getFriendRequests();

    const badge = document.getElementById('reqBadge');

    if (reqs.length) {
        badge.classList.remove('hidden');
        badge.textContent = reqs.length;
    } else {
        badge.classList.add('hidden');
    }

    if (!reqs.length) {
        list.innerHTML = `<div class="flex flex-col items-center justify-center py-16 text-center text-on-surface-variant"><span class="material-symbols-outlined text-5xl opacity-20 mb-3">mail</span><p class="text-sm">No requests</p></div>`;
        return;
    }

    list.innerHTML = reqs.map((r, i) => `
        <div class="flex items-center gap-3 px-4 py-3 border-b border-white/5 hover:bg-surface-container-low transition-smooth" style="animation: fadeUp 0.4s ease both; animation-delay: ${i * 30}ms;">
            <div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center font-headline font-black text-primary-fixed flex-shrink-0">${r.name.charAt(0).toUpperCase()}</div>
            <div style="flex:1; min-width: 0;">
                <div class="font-bold text-sm">${escapeHtml(r.name)}</div>
                <div class="text-xs text-on-surface-variant truncate">${escapeHtml(r.email)}</div>
            </div>
            <div class="flex gap-2 ml-auto">
                <button onclick="acceptRequest('${r.uid}')" class="w-8 h-8 rounded-lg bg-primary-fixed text-on-primary-fixed flex items-center justify-center hover:shadow-lg hover:shadow-primary-fixed/30 transition-smooth font-bold">✔</button>
                <button onclick="declineRequest('${r.uid}')" class="w-8 h-8 rounded-lg bg-error-container text-error flex items-center justify-center hover:shadow-lg transition-smooth font-bold">✖</button>
            </div>
        </div>
    `).join('');
}

async function acceptRequest(uid) {
    await AuraAuth.acceptFriendRequest(uid);
    await renderRequests();
    await renderFriends();
    showToast('Friend added!', false);
}

async function declineRequest(uid) {
    await AuraAuth.declineFriendRequest(uid);
    await renderRequests();
}

// ───────────────── CHAT ─────────────────
function openChat(uid, name, email) {

    if (chatRef) chatRef.off();

    activeFriendId = uid;
    activeChatId = AuraChat.getChatId(currentUser.uid, uid);

    document.getElementById('chatName').textContent = name;
    document.getElementById('chatStatus').textContent = email;
    document.getElementById('chatAvatar').textContent = name.charAt(0).toUpperCase();

    // Show chat panel on mobile
    document.getElementById('chatPanel').classList.remove('hidden');
    document.getElementById('noChatSelected').classList.add('hidden');

    const container = document.getElementById('chatMessages');
    container.innerHTML = `<div class="flex items-center justify-center py-8 text-on-surface-variant gap-2"><span class="material-symbols-outlined text-lg animate-spin">refresh</span> Loading...</div>`;

    chatRef = AuraAuth.db.ref(`chats/${activeChatId}/messages`);

    chatRef.off();

    chatRef.on('child_added', snap => {
        addMessageToUI(snap.val());
    });

    // Update active friend in sidebar
    document.querySelectorAll('.friend-item').forEach(el => {
        el.classList.remove('active', 'bg-surface-container-low', 'border-l-primary-fixed');
    });

    renderFriends();
}

function addMessageToUI(m) {
    const box = document.getElementById('chatMessages');
    
    // Clear loading message if exists
    const loading = box.querySelector('.animate-spin');
    if (loading) loading.parentElement.remove();

    const isMe = m.senderId === currentUser.uid;

    const div = document.createElement('div');
    div.className = `flex ${isMe ? 'justify-end' : 'justify-start'} animate-message`;

    div.innerHTML = `
        <div class="max-w-xs lg:max-w-md">
            <div class="px-4 py-2 rounded-2xl ${isMe ? 'bg-primary-fixed text-on-primary-fixed rounded-br-none' : 'bg-surface-container text-on-surface rounded-bl-none'}">
                <p class="text-sm font-medium break-words">${escapeHtml(m.text)}</p>
            </div>
            <p class="text-xs text-on-surface-variant mt-1 ${isMe ? 'text-right' : 'text-left'}">
                ${new Date(m.time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
            </p>
        </div>
    `;

    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
}

function closeChatPanel() {
    if (chatRef) chatRef.off();

    activeFriendId = null;
    activeChatId = null;

    document.getElementById('chatPanel').classList.add('hidden');
    document.getElementById('noChatSelected').classList.remove('hidden');
    document.getElementById('msgInput').value = '';
}

async function sendMessage() {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();

    if (!text || !activeFriendId) return;

    input.value = '';

    await AuraChat.sendMessage(activeFriendId, text);
}

function removeFriendConfirm() {
    if (!activeFriendId) return;
    
    const friendName = document.getElementById('chatName').textContent;
    
    if (confirm(`Remove ${friendName} from friends?`)) {
        // Call remove friend function if available
        showToast('Friend removed', false);
        closeChatPanel();
        renderFriends();
    }
}

// ───────────────── HELPERS ─────────────────
function escapeHtml(t) {
    return (t || '').replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;');
}

function showToast(msg, err = false) {
    const t = document.createElement('div');
    t.className = 'fixed bottom-8 left-1/2 -translate-x-1/2 z-[9999] px-6 py-3 rounded-xl font-bold text-sm shadow-2xl toast';
    t.style.background = err ? '#b92902' : '#cafd00';
    t.style.color = err ? '#fff' : '#3a4a00';
    t.textContent = msg;
    document.body.appendChild(t);
    
    setTimeout(() => {
        t.style.opacity = '0';
        t.style.transform = 'translateY(20px)';
        setTimeout(() => t.remove(), 300);
    }, 2500);
}
</script>
